apiVersion: v1
kind: Pod
metadata:
  name: flutstunde
  annotations:
    servicebay.label: "Flutstunde"
    servicebay.ports: "{{FLUTSTUNDE_PORT}}/tcp"
    servicebay.schema-version: "1"
    servicebay.dependencies: ""
    servicebay.healthcheck: "http://host.containers.internal:{{FLUTSTUNDE_PORT}}/healthz"
spec:
  containers:
    - name: flutstunde
      image: ghcr.io/mdopp/flutstunde:latest
      ports:
        - containerPort: {{FLUTSTUNDE_PORT}}
          hostPort: {{FLUTSTUNDE_PORT}}
          protocol: TCP
      resources:
        limits:
          memory: "128Mi"
          cpu: "250m"
      env:
        - name: PORT
          value: "{{FLUTSTUNDE_PORT}}"
